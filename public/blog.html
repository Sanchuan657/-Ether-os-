<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リリイ·シュシュの掲示板 - ETHER BBS</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: #001105;
            overflow-x: hidden;
        }
        body {
            color: #00ffff;
            font-family: 'MS Gothic', 'Courier New', Courier, monospace;
            text-shadow: 0 0 3px #00ffff, 0 0 8px rgba(0, 255, 255, 0.4);
            box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
            position: relative;
        }
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px; z-index: 999; pointer-events: none;
            animation: flicker 0.15s infinite; opacity: 0.8;
        }
        @keyframes flicker { 0% { opacity: 0.75; } 50% { opacity: 0.8; } 100% { opacity: 0.75; } }
        .container {
            max-width: 800px; margin: 0 auto; padding: 40px 20px;
            position: relative; z-index: 10;
        }
        h1 {
            font-size: 24px; letter-spacing: 2px;
            text-shadow: 0 0 5px #00ffff, 0 0 15px #00ffff;
            border-bottom: 1px solid rgba(0, 255, 255, 0.3);
            padding-bottom: 10px; margin-bottom: 30px;
        }
        .xp-dialog {
            background-color: #ECE9D8; border: 1px solid #0055EA;
            border-top-left-radius: 6px; border-top-right-radius: 6px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8);
            width: 100%; max-width: 500px; margin-bottom: 40px;
            font-family: 'Tahoma', 'Arial', sans-serif; color: #000; text-shadow: none;
            display: none;
        }
        .xp-titlebar {
            background: linear-gradient(to bottom, #0058e6 0%, #3a93ff 8%, #288eff 40%, #127dff 88%, #036bfe 100%);
            color: white; padding: 4px 8px; font-size: 13px; font-weight: bold;
            border-top-left-radius: 5px; border-top-right-radius: 5px;
            display: flex; justify-content: space-between; align-items: center;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.5);
        }
        .xp-close-btn {
            background: linear-gradient(to bottom, #e48173, #e54c37 50%, #c12e15 51%, #cf3f26);
            border: 1px solid white; color: white; border-radius: 3px;
            width: 20px; height: 20px; display: flex; justify-content: center;
            align-items: center; font-size: 10px; cursor: pointer;
            text-shadow: none; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8);
        }
        .xp-body { padding: 15px; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; margin-bottom: 4px; }
        .xp-input {
            border: 2px solid; border-color: #ACA899 #FFF #FFF #ACA899;
            padding: 4px; font-family: 'Tahoma', 'Arial', sans-serif;
            font-size: 13px; background: #fff; color: #000; outline: none;
        }
        textarea.xp-input { resize: vertical; min-height: 100px; }
        .xp-button-container { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
        .xp-button {
            background: linear-gradient(to bottom, #f2f2f2, #ebebeb 50%, #dddddd 51%, #cfcfcf);
            border: 1px solid #003c74; border-radius: 3px; padding: 4px 20px;
            font-family: 'Tahoma', 'Arial', sans-serif; font-size: 13px; cursor: pointer;
            box-shadow: inset 1px 1px 2px rgba(255,255,255,0.8); color: #000;
        }
        .xp-button:active { background: #cfcfcf; box-shadow: inset 1px 1px 3px rgba(0,0,0,0.3); padding: 5px 19px 3px 21px; }

        .entries-container { display: flex; flex-direction: column; gap: 20px; }
        .entry { margin-bottom: 10px; }
        .entry-meta { font-size: 14px; margin-bottom: 8px; opacity: 0.9; }
        .entry-name { font-weight: bold; color: #ffffff; text-shadow: 0 0 4px #ffffff, 0 0 10px rgba(0, 255, 255, 0.8); }
        .entry-date { font-size: 12px; opacity: 0.7; }
        .entry-message { font-size: 15px; line-height: 1.6; white-space: pre-wrap; margin-left: 10px; border-left: 1px solid rgba(0, 255, 255, 0.3); padding-left: 10px; color: #ccffcc; text-shadow: 0 0 4px rgba(0, 255, 150, 0.3); }
        .entry-message img { max-width: 100%; margin-top: 8px; border: 1px solid rgba(0, 255, 255, 0.4); }
        .separator { font-size: 12px; opacity: 0.5; letter-spacing: 2px; user-select: none; white-space: nowrap; }
        .new-btn {
            display: block; width: 100%; padding: 12px; margin-bottom: 30px;
            background: transparent; border: 2px solid rgba(0, 255, 255, 0.5); color: #00ffff;
            font-family: inherit; font-size: 14px; cursor: pointer; letter-spacing: 2px;
            transition: all 0.3s; text-align: center; text-decoration: none;
        }
        .new-btn:hover { border-color: #00ffff; text-shadow: 0 0 10px #00ffff; background: rgba(0, 255, 255, 0.05); }
        .terminal-prompt { margin-top: 40px; font-size: 14px; }
        .blink {
            animation: blinker 1s step-end infinite; display: inline-block;
            width: 8px; height: 14px; background-color: #00ffff;
            box-shadow: 0 0 5px #00ffff; vertical-align: bottom; margin-left: 2px;
        }
        @keyframes blinker { 50% { opacity: 0; } }
        ::-webkit-scrollbar { width: 12px; background: #001105; border-left: 1px solid #005500; }
        ::-webkit-scrollbar-thumb { background: #004400; border: 1px solid #00ff00; }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div class="container">
        <h1>リリイ·シュシュの掲示板</h1>

        <button class="new-btn" id="showFormBtn">＋ 新しい記事を書く</button>

        <div class="xp-dialog" id="xpForm">
            <div class="xp-titlebar">
                <span>Message_Entry_Form.exe</span>
                <div class="xp-close-btn" id="closeFormBtn">X</div>
            </div>
            <div class="xp-body">
                <form id="bbsForm">
                    <div class="form-group">
                        <label for="username">Name:</label>
                        <input type="text" id="username" class="xp-input" value="匿名" autocomplete="off" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" class="xp-input" required></textarea>
                    </div>
                    <div class="xp-button-container">
                        <button type="button" class="xp-button" id="uploadPicBtn" style="font-size:11px;">📎 図</button>
                        <button type="submit" class="xp-button">Submit</button>
                    </div>
                    <input type="file" id="picInput" accept="image/*" style="display:none;">
                </form>
            </div>
        </div>

        <div class="separator">========================================================================</div>

        <div class="entries-container" id="entriesList"></div>

        <div class="separator">========================================================================</div>

        <div class="terminal-prompt">
            user@ether-bbs:~/guestbook$ <span class="blink"></span>
        </div>
    </div>

    <script>
        const staticEntries = [
            { name: 'フィリア', date: '[2001/10/21 02:14:55]', message: 'エーテルが...足りない。\n私を満たして。' },
            { name: '星野', date: '[2001/09/14 18:03:12]', message: '誰もわかってくれない。青い空が痛い。\nリリイの歌だけが、僕の現実。' },
            { name: 'サダカ', date: '[2001/08/02 04:33:01]', message: '羽ばたくための翼が折れているなら、\nせめて堕ちていく感覚を楽しめばいい。' }
        ];

        const form = document.getElementById('xpForm');
        const showBtn = document.getElementById('showFormBtn');
        const closeBtn = document.getElementById('closeFormBtn');
        const uploadBtn = document.getElementById('uploadPicBtn');
        const picInput = document.getElementById('picInput');
        const messageBox = document.getElementById('message');

        showBtn.onclick = () => form.style.display = 'block';
        closeBtn.onclick = () => form.style.display = 'none';
        uploadBtn.onclick = () => picInput.click();

        picInput.onchange = async () => {
            const file = picInput.files[0];
            if (!file) return;
            const fd = new FormData();
            fd.append('image', file);
            try {
                const res = await fetch('/api/blog/upload-image', { method: 'POST', body: fd });
                const data = await res.json();
                if (data.wallpaper) {
                    const imgMd = `![image](${data.wallpaper})`;
                    messageBox.value += '\n' + imgMd + '\n';
                }
            } catch (e) { alert('画像のアップロードに失敗しました。'); }
        };

        async function loadPosts() {
            const res = await fetch('/api/blog/posts');
            const data = await res.json();
            const container = document.getElementById('entriesList');

            let html = '';
            staticEntries.forEach((entry, index) => {
                html += generateEntryHTML(entry.name, entry.date, entry.message);
                if (index < staticEntries.length - 1) {
                    html += '<div class="separator">- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - </div>';
                }
            });

            if (data.posts && data.posts.length > 0) {
                if (staticEntries.length > 0) {
                    html += '<div class="separator">- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - </div>';
                }
                data.posts.forEach((post, index) => {
                    const d = new Date(post.date);
                    // 使用 2001 年作为所有文章的年份，保留真实的月日时分秒
                    const dateStr = `2001/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                    const name = post.title.replace('Post by ', '') || '匿名';
                    html += generateEntryHTML(name, `[${dateStr}]`, post.content);
                    if (index < data.posts.length - 1) {
                        html += '<div class="separator">- - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - </div>';
                    }
                });
            }

            container.innerHTML = html || '<div style="text-align:center; opacity:0.5;">シグナルがありません。</div>';
        }

        function pad(n) { return String(n).padStart(2, '0'); }

        function generateEntryHTML(name, date, message) {
            return `
                <div class="entry">
                    <div class="entry-meta">
                        <span class="entry-name">${escapeHTML(name)}</span> 
                        <span class="entry-date">${escapeHTML(date)}</span>
                    </div>
                    <div class="entry-message">${formatMessage(escapeHTML(message))}</div>
                </div>
            `;
        }

        function formatMessage(text) {
            return text.replace(/!\[image\]\((.*?)\)/g, '<img src="$1" alt="image">').replace(/\n/g, '<br>');
        }

        document.getElementById('bbsForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const nameInput = document.getElementById('username').value || '匿名';
            const messageInput = messageBox.value;
            if (messageInput.trim() === '') return;

            const res = await fetch('/api/blog/post', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title: `Post by ${nameInput}`, content: messageInput })
            });
            const data = await res.json();
            if (data.success) {
                form.style.display = 'none';
                messageBox.value = '';
                loadPosts();
            }
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }

        loadPosts();
    </script>
</body>
</html>
