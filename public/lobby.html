<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lobby</title>
    <style>
        body { background: #ece9d8; padding: 20px; font-family: "Tahoma"; font-size: 12px; }
        .card { background: #fff; border: 1px solid #7f9db9; padding: 15px; margin-bottom: 10px; }
        .recent-link { display: block; color: #0000ff; margin-top: 5px; cursor: pointer; text-decoration: underline; }
        button { background: #eee; border: 1px solid #7f9db9; padding: 5px 10px; cursor: pointer; }
        hr { margin: 15px 0; border: none; border-top: 1px solid #aca899; }
        .xp-btn { background: #eee; border: 1px solid #7f9db9; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="room-section" class="card">
        <h3>🎬 加入放送室</h3>
        <input type="text" id="rid" placeholder="房间ID">
        <button onclick="go()">进入</button>
        <button onclick="go('lily-' + Math.random().toString(36).substr(7))">随机创建</button>
    </div>

    <div id="chat-section" class="card">
        <h3>📡 聊天室に参加</h3>
        <div style="display:flex; gap:6px; margin-bottom:6px;">
            <input type="text" id="chatRoomInput" placeholder="ルームIDを入力..." style="flex:1;">
            <button onclick="joinChat()">参加</button>
        </div>
        <button onclick="createChat()" style="margin-top:6px;">＋ ランダム作成</button>
    </div>

    <div class="card" id="recent-card">
        <h3 id="recent-title">📂 最近访问</h3>
        <div id="recentList">暂无记录</div>
    </div>

    <!-- 后台管理入口 -->
    <span ondblclick="showAdminLogin()" style="position:fixed; bottom:5px; right:5px; opacity:0.3; cursor:default; font-size:12px;">⚙️</span>

    <!-- 管理员登录弹窗 -->
    <div id="admin-modal" style="display:none; position:fixed; top:30%; left:25%; background:#ece9d8; border:2px solid #245edb; padding:20px; z-index:10000;">
        <h3>管理员登录</h3>
        <input type="password" id="adminPass" placeholder="密码">
        <button onclick="adminLogin()">登录</button>
        <button onclick="document.getElementById('admin-modal').style.display='none'">关闭</button>
    </div>

    <!-- 管理面板 -->
    <div id="admin-panel" style="display:none; position:fixed; top:5%; left:5%; right:5%; bottom:5%; background:#ece9d8; border:2px solid #245edb; padding:15px; z-index:10001; overflow-y:auto;">
        <h3>管理面板</h3>
        <p>修改壁纸 (URL):</p>
        <input type="text" id="newWallpaper" placeholder="输入图片URL...">
        <button class="xp-btn" onclick="changeWallpaper()">应用</button>
        
        <p style="margin-top:10px;">上传壁纸文件:</p>
        <input type="file" id="wallpaperFile" accept="image/*">
        <button class="xp-btn" onclick="uploadWallpaper()">上传并应用</button>

        <hr>
        <h4>房间列表</h4>
        <div id="room-list">加载中...</div>
        <button class="xp-btn" onclick="loadRoomList()">刷新列表</button>
        <button class="xp-btn" onclick="document.getElementById('admin-panel').style.display='none'">关闭面板</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const app = urlParams.get('app');

        if (app === 'room') {
            document.getElementById('chat-section').style.display = 'none';
        } else if (app === 'chat') {
            document.getElementById('room-section').style.display = 'none';
        }

        // 最近访问存储
        function saveRecentRoom(roomId) {
            let rooms = JSON.parse(localStorage.getItem('lily_rooms') || '[]');
            rooms = rooms.filter(r => r !== roomId);
            rooms.unshift(roomId);
            rooms = rooms.slice(0, 5);
            localStorage.setItem('lily_rooms', JSON.stringify(rooms));
        }
        function loadRecentRooms() {
            return JSON.parse(localStorage.getItem('lily_rooms') || '[]');
        }
        function saveRecentChat(roomId) {
            let chats = JSON.parse(localStorage.getItem('lily_chats') || '[]');
            chats = chats.filter(r => r !== roomId);
            chats.unshift(roomId);
            chats = chats.slice(0, 5);
            localStorage.setItem('lily_chats', JSON.stringify(chats));
        }
        function loadRecentChats() {
            return JSON.parse(localStorage.getItem('lily_chats') || '[]');
        }

        function renderRecent() {
            const container = document.getElementById('recentList');
            const title = document.getElementById('recent-title');

            if (app === 'room') {
                title.innerText = '📂 最近访问（放送室）';
                const rooms = loadRecentRooms();
                if (rooms.length === 0) {
                    container.innerHTML = '<div style="color:#888;">暂无记录</div>';
                } else {
                    container.innerHTML = rooms.map(r =>
                        `<span class="recent-link" onclick="openRoom('${r}')">${r}</span>`
                    ).join('');
                }
            } else if (app === 'chat') {
                title.innerText = '📂 最近访问（聊天室）';
                const chats = loadRecentChats();
                if (chats.length === 0) {
                    container.innerHTML = '<div style="color:#888;">暂无记录</div>';
                } else {
                    container.innerHTML = chats.map(r =>
                        `<span class="recent-link" onclick="openChat('${r}')">${r}</span>`
                    ).join('');
                }
            } else {
                title.innerText = '📂 最近访问';
                const rooms = loadRecentRooms();
                const chats = loadRecentChats();
                let html = '';
                if (rooms.length > 0) html += '<div style="margin-bottom:8px;color:#555;">放送室:</div>' + rooms.map(r => `<span class="recent-link" onclick="openRoom('${r}')">${r}</span>`).join('');
                if (chats.length > 0) html += '<div style="margin-bottom:8px;margin-top:8px;color:#555;">聊天室:</div>' + chats.map(r => `<span class="recent-link" onclick="openChat('${r}')">${r}</span>`).join('');
                container.innerHTML = html || '<div style="color:#888;">暂无记录</div>';
            }
        }

        function openRoom(roomId) { saveRecentRoom(roomId); window.open('/room?room=' + roomId, '_blank'); }
        function openChat(roomId) { saveRecentChat(roomId); window.open('/chat?room=' + roomId, '_blank'); }

        function go(id) { const room = id || document.getElementById('rid').value; if (!room) return; openRoom(room); }
        function createChat() { const roomId = 'chat-' + Math.random().toString(36).substr(2, 6); openChat(roomId); }
        function joinChat() { const roomId = document.getElementById('chatRoomInput').value.trim(); if (!roomId) { alert('ルームIDを入力してください'); return; } openChat(roomId); }

        // ===== 后台管理 =====
        let adminToken = '';

        function showAdminLogin() {
            document.getElementById('admin-modal').style.display = 'block';
        }

        async function adminLogin() {
            const pw = document.getElementById('adminPass').value;
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw })
            });
            const data = await res.json();
            if (data.success) {
                adminToken = data.token;
                document.getElementById('admin-modal').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadRoomList();
            } else {
                alert('密码错误');
            }
        }

        async function changeWallpaper() {
            const wp = document.getElementById('newWallpaper').value.trim();
            if (!wp) return;
            await fetch('/api/admin/wallpaper', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: adminToken, wallpaper: wp })
            });
            if (window.top) window.top.location.reload();
        }

        async function uploadWallpaper() {
            const file = document.getElementById('wallpaperFile').files[0];
            if (!file) return alert('请选择文件');
            const fd = new FormData();
            fd.append('image', file);
            const res = await fetch('/api/admin/uploadWallpaper', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.success || data.wallpaper) {
                alert('壁纸已更新');
                if (window.top) window.top.location.reload();
            } else {
                alert('上传失败: ' + (data.error || '未知错误'));
            }
        }

        async function loadRoomList() {
            const res = await fetch('/api/admin/rooms');
            const data = await res.json();
            const container = document.getElementById('room-list');
            container.innerHTML = data.rooms.map(r => `
                <div style="padding:5px 0; border-bottom:1px solid #ccc; display:flex; justify-content:space-between;">
                    <span>${r.roomId} (${r.users}人, 房主: ${r.ownerName})</span>
                    <button onclick="deleteRoom('${r.roomId}')" style="font-size:10px;">关闭房间</button>
                </div>
            `).join('') || '当前没有活跃房间';
        }

        async function deleteRoom(id) {
            if (!confirm('确定关闭房间 ' + id + ' 吗？')) return;
            await fetch('/api/admin/rooms/' + id, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: adminToken })
            });
            loadRoomList();
        }

        renderRecent();
    </script>
</body>
</html>
