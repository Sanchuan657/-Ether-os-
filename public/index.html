<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Ether OS - Lily Chou-Chou Edition</title>
    <style>
        :root {
            --denpa-pink: #ffb7c5;
            --window-glass: rgba(255, 255, 255, 0.4);
            --xp-taskbar: linear-gradient(to bottom, rgba(162,193,230,0.75) 0%, rgba(138,172,216,0.75) 100%);
        }

        * { box-sizing: border-box; cursor: url('https://cur.cursors-4u.net/anime/ani-11/ani1097.cur'), auto; }

        body, html { 
            height: 100%; margin: 0; overflow: hidden; 
            font-family: "MS PGothic", "Tahoma", "SimSun", sans-serif;
            background-color: #fff;
            filter: contrast(1.0) brightness(1.0) saturate(0.9);
        }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Grain.jpg');
            opacity: 0.15; pointer-events: none; z-index: 9999; mix-blend-mode: overlay;
        }

        .desktop {
            height: calc(100vh - 30px); position: relative;
            background: #3a6ea5 url('https://web.archive.org/web/20090829051947/http://www.geocities.com/lilichouchou/lily_ether_fade.jpg') no-repeat center center;
            background-size: cover; padding: 20px;
            transition: background-image 1s ease-in-out;
            box-shadow: inset 0 0 120px rgba(0, 0, 0, 0.15), inset 0 0 60px rgba(255, 255, 255, 0.2);
        }

        .desktop-icon {
            width: 80px; height: 80px; display: flex; flex-direction: column; align-items: center;
            color: #fff; font-size: 11px; cursor: pointer; text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
            margin-bottom: 20px; transition: all 0.2s; position: relative; z-index: 10;
        }
        .desktop-icon:hover { 
            background: rgba(255, 255, 255, 0.2); border: 1px dotted rgba(255,255,255,0.5); 
            filter: drop-shadow(0 0 6px var(--denpa-pink));
        }

        .icon-disc {
            width: 40px; height: 40px; margin-bottom: 5px;
            transition: transform 0.6s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .desktop-icon:hover .icon-disc { transform: rotate(25deg); }

        .sticker-float {
            position: absolute; pointer-events: auto;
            filter: drop-shadow(0 0 6px rgba(255,255,255,0.7));
        }

        .sticker-img {
            width: 100%; transition: transform 0.3s ease;
        }
        .sticker-img:hover { transform: scale(1.15) rotate(5deg); }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(10px, -14px) rotate(3deg); }
        }
        .float-anim { animation: drift 11s ease-in-out infinite; }

        .window {
            position: absolute; top: 10%; left: 20%;
            width: 600px; height: 450px;
            background: var(--window-glass);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px 8px 0 0; display: none;
            flex-direction: column; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.18), inset 0 0 0 1px rgba(255,255,255,0.25); 
            z-index: 100;
        }

        .title-bar {
            height: 30px; 
            background: linear-gradient(to right, rgba(180, 200, 220, 0.75), rgba(255, 210, 220, 0.45));
            display: flex; align-items: center; padding: 0 12px; color: white;
            font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.3); cursor: move;
            border-bottom: 1px solid rgba(255,255,255,0.35);
        }

        .btn-group { margin-left: auto; display: flex; gap: 3px; }
        .win-btn {
            width: 21px; height: 21px; border: 1px solid white; border-radius: 3px;
            display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer;
            background: rgba(255,255,255,0.3); color: #333;
        }
        .btn-close { background: linear-gradient(135deg, #ee7b64, #da4a3e); color: white; }
        
        .window-content { 
            flex: 1; display: flex; background: rgba(255,255,255,0.25); 
            border: 1px solid rgba(255,255,255,0.2); margin: 2px; position: relative;
        }
        .window-content::after {
            content: ""; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 30px rgba(255,255,255,0.2); pointer-events: none; z-index: 50;
        }
        .window-content iframe { width: 100%; height: 100%; border: none; position: relative; z-index: 10; }

        .taskbar {
            position: fixed; bottom: 0; width: 100%; height: 30px;
            background: var(--xp-taskbar); backdrop-filter: blur(10px);
            display: flex; align-items: center; z-index: 9999;
            border-top: 1px solid rgba(255,255,255,0.55);
        }
        .start-btn {
            background: linear-gradient(to bottom, #7fc29b, #5ca078);
            width: 100px; height: 100%; color: white; font-style: italic;
            font-weight: bold; border: none; border-radius: 0 10px 10px 0; cursor: pointer;
            box-shadow: inset 2px 2px 2px rgba(255,255,255,0.4);
        }
        .task-item {
            margin-left: 5px; height: 24px; min-width: 100px;
            background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.5);
            border-radius: 3px; color: #222; font-size: 11px;
            display: none; align-items: center; padding: 0 8px; cursor: pointer;
        }
        .task-item.active { background: rgba(255, 255, 255, 0.6); box-shadow: inset 0 0 5px rgba(0,0,0,0.05); }
        .systray { margin-left: auto; color: #333; font-size: 11px; padding-right: 15px; text-shadow: 0 0 2px #fff; }
        .minimized { display: none !important; }

    </style>
</head>
<body>
<div class="grain"></div>
<div class="desktop" id="desktop">
    <div class="sticker-float float-anim" style="top: 15%; right: 8%; width: 160px;"><img class="sticker-img" src="/photo/1713165j59l1s9m9v.gif"></div>
    <div class="sticker-float float-anim" style="bottom: 12%; left: 20%; width: 80px; opacity: 0.9;"><img class="sticker-img" src="/photo/2071190qmyw7c59iw.gif"></div>

    <!-- 放映室图标 -->
    <div class="desktop-icon" ondblclick="openApp()">
        <svg class="icon-disc" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#a0c4ff"/><stop offset="30%" stop-color="#ffb7c5"/><stop offset="60%" stop-color="#bdb2ff"/><stop offset="100%" stop-color="#a0c4ff"/>
                </linearGradient>
                <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/><stop offset="40%" stop-color="rgba(255,255,255,0.0)"/><stop offset="100%" stop-color="rgba(255,255,255,0.3)"/>
                </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="19" fill="url(#discGrad)" stroke="#fff" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="19" fill="url(#shineGrad)"/>
            <circle cx="20" cy="20" r="6" fill="#1a1a2e" stroke="#fff" stroke-width="1"/>
            <circle cx="20" cy="20" r="3" fill="#0d1211"/>
            <circle cx="13" cy="11" r="3" fill="rgba(255,255,255,0.5)"/>
        </svg>
        <span>莉莉周放送室</span>
    </div>

    <!-- 聊天室图标 -->
    <div class="desktop-icon" ondblclick="openChat()">
        <svg class="icon-disc" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="chatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#33ff33"/><stop offset="50%" stop-color="#00cccc"/><stop offset="100%" stop-color="#cc33cc"/>
                </linearGradient>
            </defs>
            <circle cx="20" cy="20" r="18" fill="url(#chatGrad)" stroke="#fff" stroke-width="1.5"/>
            <circle cx="20" cy="20" r="6" fill="#0a0a0a"/>
            <rect x="8" y="12" width="24" height="16" rx="3" fill="rgba(0,0,0,0.4)" stroke="#00ffff" stroke-width="0.5"/>
            <line x1="12" y1="16" x2="28" y2="16" stroke="#00ffff" stroke-width="1"/>
            <line x1="12" y1="20" x2="24" y2="20" stroke="#00ffff" stroke-width="0.7"/>
            <line x1="12" y1="24" x2="20" y2="24" stroke="#00ffff" stroke-width="0.5"/>
        </svg>
        <span>以太聊天室</span>
    </div>

    <!-- 博客图标 -->
    <div class="desktop-icon" ondblclick="openBlog()">
        <svg class="icon-disc" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#cc33cc"/><stop offset="50%" stop-color="#33ff33"/><stop offset="100%" stop-color="#00cccc"/>
                </linearGradient>
            </defs>
            <rect x="6" y="4" width="28" height="32" rx="2" fill="url(#blogGrad)" stroke="#fff" stroke-width="1.5"/>
            <line x1="10" y1="10" x2="30" y2="10" stroke="#0a0a0a" stroke-width="1.5"/>
            <line x1="10" y1="15" x2="26" y2="15" stroke="#0a0a0a" stroke-width="1"/>
            <line x1="10" y1="20" x2="28" y2="20" stroke="#0a0a0a" stroke-width="0.8"/>
            <line x1="10" y1="25" x2="22" y2="25" stroke="#0a0a0a" stroke-width="0.6"/>
            <line x1="10" y1="30" x2="24" y2="30" stroke="#0a0a0a" stroke-width="0.5"/>
        </svg>
        <span>以太博客</span>
    </div>

    </div>

    <!-- 放映室窗口 -->
    <div class="window" id="lilyWindow">
        <div class="title-bar" id="titleBar">
            <span style="font-size: 12px; letter-spacing: 0.5px;">📁 リリイ·シュシュの放送室.exe</span>
            <div class="btn-group">
                <div class="win-btn" style="background:rgba(60, 127, 177, 0.4)" onclick="minimizeApp()">_</div>
                <div class="win-btn btn-close" onclick="closeApp()">X</div>
            </div>
        </div>
        <div class="window-content"><iframe src="about:blank" id="appFrame"></iframe></div>
    </div>

    <!-- 聊天室窗口 -->
    <div class="window" id="chatWindow">
        <div class="title-bar" id="chatTitleBar">
            <span style="font-size: 12px; letter-spacing: 0.5px;">📡 ETHER_CHAT.exe</span>
            <div class="btn-group">
                <div class="win-btn" style="background:rgba(60, 127, 177, 0.4)" onclick="minimizeChat()">_</div>
                <div class="win-btn btn-close" onclick="closeChat()">X</div>
            </div>
        </div>
        <div class="window-content"><iframe src="about:blank" id="chatFrame"></iframe></div>
    </div>

        </div>
    </div>
</div>

<div class="taskbar">
    <button class="start-btn">start</button>
    <div class="task-item" id="taskTab" onclick="toggleMin()">🎵 放送室</div>
    <div class="task-item" id="chatTaskTab" onclick="toggleChatMin()">📡 聊天室</div>
    <div class="systray" id="clock">--:--</div>
</div>

<script>
    const win = document.getElementById('lilyWindow');
    const tab = document.getElementById('taskTab');
    const frame = document.getElementById('appFrame');
    const chatWin = document.getElementById('chatWindow');
    const chatTab = document.getElementById('chatTaskTab');
    const chatFrame = document.getElementById('chatFrame');

    async function loadSettings() { try { const r = await fetch('/api/settings'); const data = await r.json(); if (data.wallpaper) document.getElementById('desktop').style.backgroundImage = `url('${data.wallpaper}')`; } catch(e) {} }
    loadSettings();

    // 放映室
    function openApp() { win.style.display = 'flex'; tab.style.display = 'flex'; tab.classList.add('active'); if (frame.src.includes("about:blank") || frame.src.includes("data:text/html")) frame.src = "/lobby?app=room"; }
    function closeApp() { win.style.display = 'none'; tab.style.display = 'none'; }
    function minimizeApp() { win.classList.add('minimized'); tab.classList.remove('active'); }
    function toggleMin() { if (win.classList.contains('minimized')) { win.classList.remove('minimized'); tab.classList.add('active'); } else minimizeApp(); }
    let isDragging = false, offset = [0, 0];
    document.getElementById('titleBar').onmousedown = (e) => { isDragging = true; offset = [win.offsetLeft - e.clientX, win.offsetTop - e.clientY]; win.style.zIndex = 1000; };
    document.addEventListener('mousemove', (e) => { if (!isDragging) return; win.style.left = (e.clientX + offset[0]) + 'px'; win.style.top = (e.clientY + offset[1]) + 'px'; });
    document.addEventListener('mouseup', () => { isDragging = false; });

    // 聊天室
    function openChat() { chatWin.style.display = 'flex'; chatTab.style.display = 'flex'; chatTab.classList.add('active'); if (chatFrame.src.includes("about:blank") || chatFrame.src.includes("data:text/html")) chatFrame.src = "/lobby?app=chat"; }
    function closeChat() { chatWin.style.display = 'none'; chatTab.style.display = 'none'; }
    function minimizeChat() { chatWin.classList.add('minimized'); chatTab.classList.remove('active'); }
    function toggleChatMin() { if (chatWin.classList.contains('minimized')) { chatWin.classList.remove('minimized'); chatTab.classList.add('active'); } else minimizeChat(); }
    let isChatDragging = false, chatOffset = [0, 0];
    document.getElementById('chatTitleBar').onmousedown = (e) => { isChatDragging = true; chatOffset = [chatWin.offsetLeft - e.clientX, chatWin.offsetTop - e.clientY]; chatWin.style.zIndex = 1000; };
    document.addEventListener('mousemove', (e) => { if (!isChatDragging) return; chatWin.style.left = (e.clientX + chatOffset[0]) + 'px'; chatWin.style.top = (e.clientY + chatOffset[1]) + 'px'; });
    document.addEventListener('mouseup', () => { isChatDragging = false; });

    // 博客
    function openBlog() { window.open('/blog', '_blank'); }


    setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }, 1000);
</script>
</body>
</html>
